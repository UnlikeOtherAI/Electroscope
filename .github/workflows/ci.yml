name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end with the synthetic camera
        run: node scripts/e2e.mjs --fake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: test-output/fake
