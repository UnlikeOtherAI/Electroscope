<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Electroscope — Windows 11</title>
  <desc id="desc">A cyan and blue microscope lens on a navy tile, with circuit traces and one orange focal spark.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.25" y2="1">
      <stop stop-color="#16263d"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop stop-color="#b8efff"/>
      <stop offset="0.5" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#2358d8"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b8efff" stop-opacity="0.25"/>
      <stop offset="0.48" stop-color="#b8efff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#08111f" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.25" r="0.85">
      <stop stop-color="#17406a"/>
      <stop offset="0.6" stop-color="#0c2440"/>
      <stop offset="1" stop-color="#071426"/>
    </radialGradient>
    <radialGradient id="seat">
      <stop offset="0.77" stop-color="#020812" stop-opacity="0.65"/>
      <stop offset="0.90" stop-color="#020812" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#020812" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="reflection" cx="0.38" cy="0.28" r="0.5">
      <stop stop-color="#b8efff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#b8efff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#b8efff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#020812" stop-opacity="0.65"/>
      <stop offset="0.6" stop-color="#020812" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ff9a76" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff9a76" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff9a76" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed body: 96px corner radius, no exterior shadow. -->
  <rect width="1024" height="1024" rx="96" fill="url(#tile)"/>
  <rect x="1" y="1" width="1022" height="1022" rx="95" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <!-- Same lens artwork, scaled proportionally for the larger tile. -->
  <g transform="translate(512 512) scale(1.15) translate(-512 -512)">
  <!-- A soft recessed seat, with a wider, simpler blue lens barrel. -->
  <circle cx="512" cy="526" r="345" fill="url(#seat)"/>
  <circle cx="512" cy="512" r="320" fill="url(#ring)"/>
  <circle cx="512" cy="512" r="320" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="512" cy="512" r="258" fill="#071426"/>
  <circle cx="512" cy="516" r="249" fill="url(#glass)"/>
  <circle cx="512" cy="512" r="255" fill="none" stroke="url(#glass-shade)" stroke-width="14"/>

  <!-- Four broad traces; no tiny pads, reticle, or hairline marks. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M288 512 H414" stroke="#7fe0ff" stroke-width="22"/>
    <path d="M610 512 H644 L707 449 H731" stroke="#7fe0ff" stroke-width="22"/>
    <path d="M324 401 H365 L414 352 V322" stroke="#3fb7ff" stroke-width="18" opacity="0.48"/>
    <path d="M700 614 H659 L610 663 V703" stroke="#3fb7ff" stroke-width="18" opacity="0.48"/>
  </g>

  <!-- The reflection fades continuously across the glass: no cut-out blob. -->
  <circle cx="512" cy="512" r="244" fill="url(#reflection)"/>

  <!-- One warm focal point; the halo uses a gradient, never an SVG filter. -->
  <circle cx="512" cy="512" r="115" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="47" fill="#ff8a65" stroke="#ffd2c2" stroke-width="5"/>
  <circle cx="500" cy="499" r="9" fill="#ffd2c2" opacity="0.85"/>
  </g>
</svg>
